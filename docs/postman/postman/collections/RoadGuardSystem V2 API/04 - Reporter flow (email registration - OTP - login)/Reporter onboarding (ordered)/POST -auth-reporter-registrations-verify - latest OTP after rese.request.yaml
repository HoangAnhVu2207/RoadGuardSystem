$kind: http-request
name: POST /auth/reporter-registrations/verify - latest OTP after resend
description: "MANUAL EMAIL. Purpose: verify the newest OTP after proving the original code is invalid. Setup: OTP_RESEND scenario, enter the newest mailbox code in otpLatestOtp. Expected: 200 TokenPair. Data change: activates the pending Reporter and creates one session."
url: "{{baseUrl}}/api/v1/auth/reporter-registrations/verify"
method: POST
headers:
  Idempotency-Key: "{{otpLatestVerificationKey}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "intentId": "{{otpResendIntentId}}",
      "otp": "{{otpLatestOtp}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      if (pm.environment.get('manualEmailScenario') !== 'OTP_RESEND') { console.warn('[RoadGuard Postman] Skipped: choose RoadGuard.local.private and set manualEmailScenario=OTP_RESEND.'); pm.execution.skipRequest(); }
      if (!pm.environment.get('otpLatestOtp')) throw new Error('Enter the newest OTP in otpLatestOtp first');
      if (!pm.environment.get('otpLatestVerificationKey')) pm.environment.set('otpLatestVerificationKey', pm.variables.replaceIn('{{$guid}}'));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Latest OTP verification returns 200', function () { pm.response.to.have.status(200); });
      if (pm.response.code === 200) { var b = pm.response.json(); pm.collectionVariables.set('accessToken', b.accessToken); pm.collectionVariables.set('refreshToken', b.refreshToken); }
    language: text/javascript
order: 7000
