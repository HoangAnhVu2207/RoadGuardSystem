$kind: http-request
name: GET /me/inspection-tasks - success
description: "Purpose: list inspection tasks actively assigned to the current repair crew. Role: Repair Crew with effective project membership. Setup: login as the seeded crew account and set accessToken; optionally set inspectionCursor from a prior response. Expected: 200 InspectionTaskPage. Data change: none."
url: "{{baseUrl}}/api/v1/me/inspection-tasks?limit={{inspectionLimit}}"
method: GET
headers:
  Authorization: Bearer {{repairCrewAccessToken}}
  Accept: application/json
queryParams:
  - key: limit
    value: "{{inspectionLimit}}"
  - key: cursor
    value: "{{inspectionCursor}}"
    disabled: true
scripts:
  - type: afterResponse
    code: |-
      pm.test('Inspection task list returns 200', function () { pm.response.to.have.status(200); });
      if (pm.response.code === 200) { var b = pm.response.json(); pm.expect(b).to.have.property('items'); pm.expect(b).to.have.property('asOf'); if (b.nextCursor) pm.collectionVariables.set('inspectionCursor', b.nextCursor); }
    language: text/javascript
order: 1000
