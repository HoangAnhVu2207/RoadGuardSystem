$kind: http-request
name: GET /users/{userId} - wrong role
description: "Purpose: prove non-Supervisor cannot read admin account projection. Role: non-Supervisor. Setup: operatorAccessToken and targetUserId. Expected: 403. Data change: none."
url: "{{baseUrl}}/api/v1/users/{{targetUserId}}"
method: GET
headers:
  Authorization: Bearer {{operatorAccessToken}}
scripts:
  - type: afterResponse
    code: pm.test('Wrong role account read returns 403', function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 6000
