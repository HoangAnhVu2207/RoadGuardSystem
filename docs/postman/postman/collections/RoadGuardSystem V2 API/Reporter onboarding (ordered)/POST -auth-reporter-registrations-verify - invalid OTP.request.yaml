$kind: http-request
name: POST /auth/reporter-registrations/verify - invalid OTP
description: "Purpose: reject an invalid OTP without issuing credentials. Role: public intent holder. Setup: use a pending registrationIntentId. Expected: 400/404/429 without tokens. Data change: failed-attempt counter only."
url: "{{baseUrl}}/api/v1/auth/reporter-registrations/verify"
method: POST
headers:
  Idempotency-Key: "{{$guid}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "intentId": "{{registrationIntentId}}",
      "otp": "000000"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Invalid OTP is rejected', function () { pm.expect([400, 404, 429]).to.include(pm.response.code); });
      pm.test('No token leak', function () { pm.expect(pm.response.text()).to.not.match(/accessToken|refreshToken/i); });
    language: text/javascript
order: 5000
