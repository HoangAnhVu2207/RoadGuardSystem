$kind: http-request
name: POST /auth/login - valid
description: "Purpose: authenticate the selected seeded account. Role: any seeded role. Setup: set authEmail/authPassword in the environment. Expected: 200 with accessToken, refreshToken and user. Errors: 400/401 for invalid input. Data change: creates a session."
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{authEmail}}",
      "password": "{{authPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login returns 200', function () { pm.response.to.have.status(200); });
      if (pm.response.code === 200) { var b = pm.response.json(); pm.collectionVariables.set('accessToken', b.accessToken); pm.collectionVariables.set('refreshToken', b.refreshToken); pm.collectionVariables.set('profileRowVersion', b.user.version); pm.collectionVariables.set('targetUserId', b.user.id); }
    language: text/javascript
order: 1000
