$kind: http-request
name: PUT /profile
description: "Purpose: update the current profile. Role: authenticated user. Setup: run GET /profile and use its rowVersion; use a fresh operationId. Expected: 200 or documented 409 conflict. Data change: updates profile."
url: "{{baseUrl}}/api/v1/profile"
method: PUT
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "displayName": "Postman Test User",
      "email": "{{authEmail}}",
      "expectedRowVersion": "{{profileRowVersion}}",
      "operationId": "{{$guid}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('Profile update returns 200 or 409', function () { pm.expect([200, 409]).to.include(pm.response.code); });
    language: text/javascript
  - type: beforeRequest
    code: if (pm.environment.get('runDestructive') !== 'true' || pm.environment.get('disposableAccountConfirmed') !== 'YES') { console.warn('[RoadGuard Postman] Skipped state-changing request. Use a disposable account, then set runDestructive=true and disposableAccountConfirmed=YES.'); pm.execution.skipRequest(); }
    language: text/javascript
order: 3000
