$kind: http-request
name: POST /auth/login - invalid credentials
description: "Purpose: verify credential rejection. Role: none. Setup: API reachable. Expected: 401 and stable auth error without tokens. Data change: none."
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{supervisorEmail}}",
      "password": "invalid-password"
    }
scripts:
  - type: afterResponse
    code: pm.test('Invalid login returns 401', function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 2000
