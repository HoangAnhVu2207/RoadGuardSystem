$kind: http-request
name: POST /auth/reporter-registrations/resend
description: "MANUAL EMAIL. Purpose: resend OTP after cooldown and invalidate the old code. Setup: run the separate otpResendEmail registration, set manualEmailScenario=OTP_RESEND, wait for resendAfterSeconds, and retain the same key only for a retry of the same operation. Expected: 202 or 429. Never include this request in an unattended collection run."
url: "{{baseUrl}}/api/v1/auth/reporter-registrations/resend"
method: POST
headers:
  Idempotency-Key: "{{reporterResendKey}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "intentId": "{{otpResendIntentId}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      if (pm.environment.get('manualEmailScenario') !== 'OTP_RESEND') { console.warn('[RoadGuard Postman] Skipped: choose RoadGuard.local.private and set manualEmailScenario=OTP_RESEND.'); pm.execution.skipRequest(); }
      if (!pm.environment.get('otpResendIntentId')) throw new Error('Run setup resend mailbox first');
      if (!pm.environment.get('reporterResendKey')) pm.environment.set('reporterResendKey', pm.variables.replaceIn('{{$guid}}'));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Resend respects cooldown', function () { pm.expect([202, 429]).to.include(pm.response.code); });
      if (pm.response.code === 202) pm.environment.set('otpResendAfterSeconds', String(pm.response.json().resendAfterSeconds));
    language: text/javascript
order: 5000
