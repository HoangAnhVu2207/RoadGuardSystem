# Disposable demo storage only. Use its own explicit Compose project name.
# No shared bucket/database, fixed container name, or repository credentials.
services:
  minio:
    image: ${ANH02_MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    command: server /data --console-address :9001
    ports:
      - "127.0.0.1:${ANH02_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${ANH02_MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${ANH02_MINIO_USER:?Disposable MinIO credential required}
      MINIO_ROOT_PASSWORD: ${ANH02_MINIO_PASSWORD:?Disposable MinIO credential required}
    volumes:
      - demo_objects:/data
volumes:
  demo_objects:
