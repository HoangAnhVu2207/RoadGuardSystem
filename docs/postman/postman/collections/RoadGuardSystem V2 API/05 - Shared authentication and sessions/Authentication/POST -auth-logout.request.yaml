$kind: http-request
name: POST /auth/logout
description: "Purpose: revoke the active session. Role: authenticated user. Setup: run login first; use a fresh Idempotency-Key. Expected: 204. Data change: session revocation."
url: "{{baseUrl}}/api/v1/auth/logout"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Idempotency-Key: "{{logoutKey}}"
scripts:
  - type: afterResponse
    code: pm.test('Logout returns 204', function () { pm.response.to.have.status(204); });
    language: text/javascript
  - type: beforeRequest
    code: if (pm.environment.get('runDestructive') !== 'true') { console.warn('[RoadGuard Postman] Skipped logout because it revokes the current session.'); pm.execution.skipRequest(); }
    language: text/javascript
order: 6000
