$kind: http-request
name: POST /invitations - success
description: "MANUAL EMAIL. Purpose: Supervisor creates a one-time staff invitation. Setup: login as seeded Supervisor, set invitationEmail and manualEmailScenario=INVITATION; confirm no active/accepted invitation or account exists. Expected: 201 with ETag and Location. Data change: invitation/token hash/idempotency receipt."
url: "{{baseUrl}}/api/v1/invitations"
method: POST
headers:
  Authorization: Bearer {{supervisorAccessToken}}
  Idempotency-Key: "{{invitationCreateKey}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{invitationEmail}}",
      "role": "OPERATOR",
      "projectIds": ["{{projectId}}"]
    }
scripts:
  - type: beforeRequest
    code: |-
      if (pm.environment.get('manualEmailScenario') !== 'INVITATION') { console.warn('[RoadGuard Postman] Skipped: choose RoadGuard.local.private and set manualEmailScenario=INVITATION.'); pm.execution.skipRequest(); }
      ['invitationEmail', 'supervisorAccessToken', 'projectId'].forEach(function (key) { if (!pm.environment.get(key) && !pm.collectionVariables.get(key)) throw new Error('Missing setup value: ' + key); });
      if (!pm.environment.get('invitationCreateKey')) pm.environment.set('invitationCreateKey', pm.variables.replaceIn('{{$guid}}'));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Invitation create returns 201', function () { pm.response.to.have.status(201); });
      pm.test('Invitation token is not returned', function () { pm.expect(pm.response.text()).to.not.match(/invitationToken/i); });
      if (pm.response.code === 201) { var b = pm.response.json(); pm.environment.set('invitationId', b.id); pm.environment.set('invitationVersion', b.version); }
    language: text/javascript
order: 1000
