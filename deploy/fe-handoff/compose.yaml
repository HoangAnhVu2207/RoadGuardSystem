# Isolated development only. No SQL/admin host ports, no host bind secrets.
services:
  init:
    mem_limit: 128m
    cpus: 0.25
    build:
      context: ../..
      dockerfile: deploy/fe-handoff/Dockerfile.Handoff
      target: init
    environment:
      RG_FE_OBJECT_PORT: ${RG_FE_OBJECT_PORT:-19001}
      RG_FE_ORIGINS: ${RG_FE_ORIGINS:-http://localhost:5173,http://localhost:8081,http://127.0.0.1:5173,http://127.0.0.1:8081}
    volumes:
      - state:/state
      - ai-token:/ai-token
    network_mode: none
  sql:
    mem_limit: 2304m
    cpus: 1.0
    build:
      context: ../..
      dockerfile: deploy/fe-handoff/Dockerfile.Handoff
      target: sql
    hostname: roadguard-handoff
    entrypoint: [bash, /sql-start.sh]
    environment:
      ACCEPT_EULA: Y
      MSSQL_MEMORY_LIMIT_MB: '1024'
    volumes:
      - sql-data:/var/opt/mssql
      - state:/handoff:ro
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$(cat /handoff/sql-password)" -Q "SELECT 1" -b -o /dev/null']
      interval: 5s
      timeout: 5s
      retries: 60
    networks: [internal]
  minio:
    mem_limit: 384m
    cpus: 0.5
    build:
      context: .
      dockerfile: Dockerfile.Minio
    entrypoint: [/bin/sh, -c]
    command: ['set -a; . /handoff/storage.env; exec minio server /data']
    volumes: [objects:/data, state:/handoff:ro]
    depends_on:
      init: {condition: service_completed_successfully}
    ports: ['127.0.0.1:${RG_FE_OBJECT_PORT:-19001}:9000']
    networks: [internal, edge]
  mailpit:
    mem_limit: 128m
    cpus: 0.25
    image: axllent/mailpit@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes: [mail:/data]
    ports: ['127.0.0.1:${RG_FE_MAIL_PORT:-18026}:8025']
    networks: [internal, edge]
  api:
    mem_limit: 512m
    cpus: 0.75
    build:
      context: ../..
      dockerfile: deploy/fe-handoff/Dockerfile.Handoff
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ROADGUARD_HANDOFF: '1'
      AiRealWorker__Enabled: 'true'
      AiRealWorker__WorkerEndpoint: http://ai:8999/
      AiRealWorker__ServiceTokenFile: /run/secrets/ai-token
      AiRealWorker__TempRoot: /ai-be-spool
      AiRealWorker__FfprobePath: /usr/bin/ffprobe
    volumes:
      - state:/handoff:ro
      - keys:/keys
      - ai-token:/run/secrets:ro
      - ai-spool:/ai-be-spool
    ports: ['127.0.0.1:${RG_FE_API_PORT:-18081}:8080']
    depends_on:
      sql: {condition: service_healthy}
      minio: {condition: service_started}
      mailpit: {condition: service_started}
      ai: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; head -1 <&3 | grep -q "200"''']
      interval: 5s
      timeout: 5s
      retries: 60
    networks: [internal, edge]
  ai:
    mem_limit: 2304m
    cpus: 2.0
    build:
      context: ../..
      dockerfile: deploy/fe-handoff/Dockerfile.AI.Handoff
    platform: linux/amd64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=256m,uid=10001,gid=10001']
    stop_grace_period: 120s
    environment:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    volumes:
      - ai-work:/worker
      - ai-token:/run/secrets:ro
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, /app/ai-healthcheck.py]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s
    networks: [internal]
  scenarios:
    profiles: [scenarios]
    mem_limit: 256m
    cpus: 0.5
    build:
      context: ../..
      dockerfile: deploy/fe-handoff/Dockerfile.Handoff
      target: scenarios
    volumes: [state:/handoff:ro, scenario-progress:/progress]
    depends_on:
      api: {condition: service_healthy}
    networks: [internal]
networks:
  internal: {internal: true}
  edge: {}
volumes:
  scenario-progress: {}
  state: {}
  sql-data: {}
  objects: {}
  mail: {}
  keys: {}
  ai-token: {}
  ai-work: {}
  ai-spool: {}
