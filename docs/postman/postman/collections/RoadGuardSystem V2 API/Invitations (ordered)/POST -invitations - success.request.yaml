$kind: http-request
name: POST /invitations - success
description: "MANUAL EMAIL. Purpose: Supervisor creates a one-time staff invitation. Setup: login as seeded Supervisor, set invitationEmail and manualEmailScenario=INVITATION; confirm no active/accepted invitation or account exists. Expected: 201 with ETag and Location. Data change: invitation/token hash/idempotency receipt."
url: "{{baseUrl}}/api/v1/invitations"
method: POST
headers:
  Authorization: Bearer {{supervisorAccessToken}}
  Idempotency-Key: "{{invitationCreateKey}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{invitationEmail}}",
      "role": "OPERATOR",
      "projectIds": []
    }
scripts:
  - type: beforeRequest
    code: if (pm.environment.get('manualEmailScenario') !== 'INVITATION') pm.execution.skipRequest();
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Invitation create returns 201', function () { pm.response.to.have.status(201); });
      pm.test('Invitation token is not returned', function () { pm.expect(pm.response.text()).to.not.match(/invitationToken/i); });
      if (pm.response.code === 201) { var b = pm.response.json(); pm.collectionVariables.set('invitationId', b.id); pm.collectionVariables.set('invitationVersion', b.version); }
    language: text/javascript
order: 1000
