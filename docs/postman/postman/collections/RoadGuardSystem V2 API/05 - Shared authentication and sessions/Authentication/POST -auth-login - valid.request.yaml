$kind: http-request
name: POST /auth/login - valid
description: "Purpose: authenticate the selected seeded account. Role: any seeded role. Setup: set authEmail/authPassword in the environment. Expected: 200 with accessToken, refreshToken and user. Errors: 400/401 for invalid input. Data change: creates a session."
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{authEmail}}",
      "password": "{{authPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login returns 200', function () { pm.response.to.have.status(200); });
      if (pm.response.code === 200) { var b = pm.response.json(); pm.environment.set('accessToken', b.accessToken); pm.environment.set('refreshToken', b.refreshToken); pm.environment.set('profileRowVersion', b.user.version); pm.environment.set('authenticatedUserId', b.user.id); var roleTokens = { SUPERVISOR: 'supervisorAccessToken', PM: 'projectManagerAccessToken', OPERATOR: 'operatorAccessToken', CREW: 'repairCrewAccessToken', REPORTER: 'reporterAccessToken' }; if (roleTokens[b.user.role]) pm.environment.set(roleTokens[b.user.role], b.accessToken); }
    language: text/javascript
  - type: beforeRequest
    code: if (pm.environment.get('runManualLogin') !== 'true') { console.warn('[RoadGuard Postman] Manual login is disabled in batch mode. Use the role fixture login requests.'); pm.execution.skipRequest(); }
    language: text/javascript
order: 1000
