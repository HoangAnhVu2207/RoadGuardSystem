$kind: http-request
description: Role fixture login for PM. Requires the Development DbInitializer account to be active and unchanged. Saves the token to projectManagerAccessToken. No account data is changed.
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{projectManagerEmail}}",
      "password": "{{projectManagerPassword}}"
    }
scripts:
  - type: beforeRequest
    code: if (!pm.environment.get('projectManagerPassword')) throw new Error('Set projectManagerPassword in the active local environment first.');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('PM fixture login returns 200', function () { pm.response.to.have.status(200); });
      if (pm.response.code === 200) { var b = pm.response.json(); pm.test('Login role is PM', function () { pm.expect(b.user.role).to.eql('PM'); }); pm.environment.set('projectManagerAccessToken', b.accessToken); pm.environment.set('accessToken', b.accessToken); pm.environment.set('refreshToken', b.refreshToken); pm.environment.set('authenticatedUserId', b.user.id); pm.environment.set('profileRowVersion', b.user.version); }
    language: text/javascript
order: 2000
