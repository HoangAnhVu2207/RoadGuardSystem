$kind: http-request
name: POST /auth/password-recovery-requests
description: "Purpose: request password recovery. Role: unauthenticated caller. Setup: set a permitted email. Expected: 202 without credential disclosure. Data change: creates a recovery request."
url: "{{baseUrl}}/api/v1/auth/password-recovery-requests"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{authEmail}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Recovery returns 202', function () { pm.response.to.have.status(202); });
      pm.test('No credential disclosure', function () { pm.expect(pm.response.text()).to.not.match(/passwordHash|temporaryPassword/i); });
    language: text/javascript
order: 4000
