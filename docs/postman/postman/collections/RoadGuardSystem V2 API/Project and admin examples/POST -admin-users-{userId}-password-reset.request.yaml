$kind: http-request
name: POST /admin/users/{userId}/password-reset
description: "Purpose: exercise administrative password reset. Role: Supervisor/admin policy. Setup: authenticate an allowed role and provide targetUserId/targetRowVersion from a permitted response. Expected: documented success or 400/403/404/409. Data change: destructive target credential change."
url: "{{baseUrl}}/api/v1/admin/users/{{targetUserId}}/password-reset"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "expectedTargetRowVersion": "{{targetRowVersion}}",
      "operationId": "{{$guid}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Reset returns a documented result', function () { pm.expect([200, 400, 403, 404, 409]).to.include(pm.response.code); });
      pm.test('Password hash is not returned', function () { pm.expect(pm.response.text()).to.not.match(/passwordHash/i); });
    language: text/javascript
order: 1000
