$kind: http-request
name: POST /users/{userId}/password-reset - destructive
description: "Purpose: reset a disposable active account without echoing the secret. Role: Supervisor. Setup: target must be ACTIVE; set replacementPassword and supervisorAccessToken. Expected: 204. Data change: credential replacement, forced change, session revocation, audit/idempotency."
url: "{{baseUrl}}/api/v1/users/{{targetUserId}}/password-reset"
method: POST
headers:
  Authorization: Bearer {{supervisorAccessToken}}
  Idempotency-Key: "{{passwordResetKey}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "temporaryPassword": "{{replacementPassword}}",
      "reason": "ADMINISTRATOR_INITIATED"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Password reset returns 204', function () { pm.response.to.have.status(204); });
      pm.test('Password is not echoed', function () { pm.expect(pm.response.text()).to.equal(''); });
    language: text/javascript
  - type: beforeRequest
    code: |-
      if (pm.environment.get('runDestructive') !== 'true' || pm.environment.get('disposableAccountConfirmed') !== 'YES') { console.warn('[RoadGuard Postman] Skipped state-changing request. Use a disposable account, then set runDestructive=true and disposableAccountConfirmed=YES.'); pm.execution.skipRequest(); }
      if (!pm.environment.get('targetUserId')) throw new Error('Set targetUserId to a disposable target account; login never fills this admin target.');
    language: text/javascript
order: 3000
