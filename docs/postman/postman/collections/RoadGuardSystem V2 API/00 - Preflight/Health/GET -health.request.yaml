$kind: http-request
name: GET /health
description: "Purpose: confirm the API is reachable. Role: none. Setup: select RoadGuard.local and set baseUrl. Expected: 200 (or 204). Data change: none."
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: pm.test('Health is available', function () { pm.expect(pm.response.code).to.be.oneOf([200, 204]); });
    language: text/javascript
order: 1000
