$kind: http-request
name: GET /me
description: "Purpose: read the authoritative current actor. Role: authenticated. Setup: login first. Expected: 200 Actor. Data change: none."
url: "{{baseUrl}}/api/v1/me"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('GET me returns 200', function () { pm.response.to.have.status(200); });
      if (pm.response.code === 200) pm.collectionVariables.set('actorVersion', pm.response.json().version);
    language: text/javascript
order: 1000
