$kind: http-request
name: POST /invitations/accept - success and replay
description: "Purpose: accept a one-time invitation and support same-key replay. Role: public invitation holder. Setup: run create, copy token from mailbox into invitationToken, set invitationPassword. Expected: 200 TokenPair on first call and same-key replay. Data change: creates account/memberships/session once."
url: "{{baseUrl}}/api/v1/invitations/accept"
method: POST
headers:
  Idempotency-Key: "{{invitationAcceptKey}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "invitationToken": "{{invitationToken}}",
      "displayName": "Invited Operator",
      "password": "{{invitationPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Invitation accept returns 200', function () { pm.response.to.have.status(200); });
      if (pm.response.code === 200) { var b = pm.response.json(); pm.collectionVariables.set('targetUserId', b.user.id); pm.collectionVariables.set('targetRowVersion', b.user.version); pm.environment.set('operatorAccessToken', b.accessToken); }
    language: text/javascript
order: 3000
