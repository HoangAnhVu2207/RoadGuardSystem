$kind: http-request
name: PATCH /me - stale version
description: "Purpose: reject stale optimistic concurrency. Role: authenticated self. Setup: login first. Expected: 412. Data change: none."
url: "{{baseUrl}}/api/v1/me"
method: PATCH
headers:
  Authorization: Bearer {{accessToken}}
  Idempotency-Key: "{{$guid}}"
  If-Match: '"AAAAAAAAAAA="'
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "displayName": "Must Not Persist"
    }
scripts:
  - type: afterResponse
    code: pm.test('Stale PATCH me returns 412', function () { pm.response.to.have.status(412); });
    language: text/javascript
  - type: beforeRequest
    code: if (pm.environment.get('runDestructive') !== 'true' || pm.environment.get('disposableAccountConfirmed') !== 'YES') { console.warn('[RoadGuard Postman] Skipped state-changing request. Use a disposable account, then set runDestructive=true and disposableAccountConfirmed=YES.'); pm.execution.skipRequest(); }
    language: text/javascript
order: 4000
