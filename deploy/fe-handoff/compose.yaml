# Isolated development only. No SQL/admin host ports, no host bind secrets.
services:
  init:
    build:
      context: ../..
      dockerfile: deploy/fe-handoff/Dockerfile.Handoff
      target: init
    environment:
      RG_FE_OBJECT_PORT: ${RG_FE_OBJECT_PORT:-19001}
      RG_FE_ORIGINS: ${RG_FE_ORIGINS:-http://localhost:5173,http://localhost:8081,http://127.0.0.1:5173,http://127.0.0.1:8081}
    volumes:
      - state:/state
    network_mode: none
  sql:
    build:
      context: ../..
      dockerfile: deploy/fe-handoff/Dockerfile.Handoff
      target: sql
    hostname: roadguard-handoff
    entrypoint: [bash, /sql-start.sh]
    environment:
      ACCEPT_EULA: Y
      MSSQL_MEMORY_LIMIT_MB: '1024'
    volumes:
      - sql-data:/var/opt/mssql
      - state:/handoff:ro
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$(cat /handoff/sql-password)" -Q "SELECT 1" -b -o /dev/null']
      interval: 5s
      timeout: 5s
      retries: 60
    networks: [internal]
  minio:
    build:
      context: .
      dockerfile: Dockerfile.Minio
    entrypoint: [/bin/sh, -c]
    command: ['set -a; . /handoff/storage.env; exec minio server /data']
    volumes: [objects:/data, state:/handoff:ro]
    depends_on:
      init: {condition: service_completed_successfully}
    ports: ['127.0.0.1:${RG_FE_OBJECT_PORT:-19001}:9000']
    networks: [internal, edge]
  mailpit:
    image: axllent/mailpit@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes: [mail:/data]
    ports: ['127.0.0.1:${RG_FE_MAIL_PORT:-18026}:8025']
    networks: [internal, edge]
  api:
    build:
      context: ../..
      dockerfile: deploy/fe-handoff/Dockerfile.Handoff
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ROADGUARD_HANDOFF: '1'
    volumes:
      - state:/handoff:ro
      - keys:/keys
    ports: ['127.0.0.1:${RG_FE_API_PORT:-18081}:8080']
    depends_on:
      sql: {condition: service_healthy}
      minio: {condition: service_started}
      mailpit: {condition: service_started}
    healthcheck:
      test: [CMD-SHELL, 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; head -1 <&3 | grep -q "200"''']
      interval: 5s
      timeout: 5s
      retries: 60
    networks: [internal, edge]
  scenarios:
    build:
      context: ../..
      dockerfile: deploy/fe-handoff/Dockerfile.Handoff
      target: scenarios
    volumes: [state:/handoff:ro, scenario-progress:/progress]
    depends_on:
      api: {condition: service_healthy}
    networks: [internal]
networks:
  internal: {internal: true}
  edge: {}
volumes:
  scenario-progress: {}
  state: {}
  sql-data: {}
  objects: {}
  mail: {}
  keys: {}
