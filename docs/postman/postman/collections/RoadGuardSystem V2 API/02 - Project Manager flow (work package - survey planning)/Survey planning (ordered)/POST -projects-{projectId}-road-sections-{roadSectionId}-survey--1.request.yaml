$kind: http-request
name: POST /projects/{projectId}/road-sections/{roadSectionId}/survey-requests - success
description: "Purpose: create a survey request from the plan. Role: Project Manager with effective project scope. Setup: run plan create first. Expected: 201 request. Data change: request, audit and idempotency receipt."
url: "{{baseUrl}}/api/v1/projects/{{projectId}}/road-sections/{{roadSectionId}}/survey-requests"
method: POST
headers:
  Authorization: Bearer {{projectManagerAccessToken}}
  Idempotency-Key: "{{surveyRequestCreateKey}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "surveyPlanId": "{{surveyPlanId}}",
      "roadSectionVersionId": "{{roadSectionVersionId}}",
      "surveyType": 2,
      "dueAt": "2026-10-04T17:00:00Z",
      "outputRequirements": "{\"formats\":[\"video\",\"srt\"]}",
      "operationId": "{{$guid}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Survey request create returns 201', function () { pm.response.to.have.status(201); });
      if (pm.response.code === 201) pm.environment.set('surveyRequestId', pm.response.json().requestId);
    language: text/javascript
order: 2000
