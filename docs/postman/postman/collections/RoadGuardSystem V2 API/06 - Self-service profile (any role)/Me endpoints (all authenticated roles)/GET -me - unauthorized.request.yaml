$kind: http-request
name: GET /me - unauthorized
description: "Purpose: prove bearer is required. Role: none. Setup: none. Expected: 401. Data change: none."
url: "{{baseUrl}}/api/v1/me"
method: GET
scripts:
  - type: afterResponse
    code: pm.test('GET me without token returns 401', function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 2000
