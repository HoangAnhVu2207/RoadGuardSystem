$kind: http-request
name: POST /auth/password-recovery-requests
description: "MANUAL EMAIL. Purpose: request password recovery. Setup: set recoveryEmail and manualEmailScenario=RECOVERY. Expected: neutral 202 and Location whether or not the account exists. Data change: creates a recovery request; never reveals account existence."
url: "{{baseUrl}}/api/v1/auth/password-recovery-requests"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{recoveryEmail}}"
    }
scripts:
  - type: beforeRequest
    code: if (pm.environment.get('manualEmailScenario') !== 'RECOVERY') pm.execution.skipRequest();
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Recovery returns 202', function () { pm.response.to.have.status(202); });
      pm.test('Recovery returns Location', function () { pm.expect(pm.response.headers.get('Location')).to.match(/^\/api\/v1\/auth\/password-recovery-requests\//); });
      pm.test('No credential disclosure', function () { pm.expect(pm.response.text()).to.not.match(/passwordHash|temporaryPassword/i); });
    language: text/javascript
order: 4000
