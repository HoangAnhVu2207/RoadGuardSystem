$kind: http-request
name: POST /auth/change-password - destructive
description: "Purpose: change the current user's password. Role: authenticated user. Setup: run login; set replacementPassword; use a disposable account and fresh Idempotency-Key. Expected: 204. Errors: 400/401/409 per contract. Data change: destructive credential/session change."
url: "{{baseUrl}}/api/v1/auth/change-password"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Idempotency-Key: "{{changePasswordKey}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "{{authPassword}}",
      "newPassword": "{{replacementPassword}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('Password change returns 204', function () { pm.response.to.have.status(204); });
    language: text/javascript
  - type: beforeRequest
    code: |-
      if (pm.environment.get('runDestructive') !== 'true' || pm.environment.get('disposableAccountConfirmed') !== 'YES') { console.warn('[RoadGuard Postman] Skipped destructive action. Use a disposable account, set runDestructive=true and disposableAccountConfirmed=YES.'); pm.execution.skipRequest(); }
      var fixtureEmails = ['supervisor.postman@example.test','pm.postman@example.test','operator.postman@example.test','crew.postman@example.test']; if (fixtureEmails.indexOf(String(pm.environment.get('authEmail') || '').toLowerCase()) >= 0) throw new Error('Refusing password change for a seeded fixture account.');
    language: text/javascript
order: 5000
